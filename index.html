<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guevara Câmbio</title><style>
body{font-family:Arial;margin:0;background:#f4f6f8;color:#17202a}header{background:#071a2d;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:20px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.c{background:white;padding:18px;border-radius:14px;box-shadow:0 2px 12px #0001}input,select,button{width:100%;padding:11px;margin:5px 0;box-sizing:border-box}button{background:#0866c6;color:white;border:0;border-radius:8px;font-weight:bold}.hide{display:none}nav button{width:auto}.item{border-top:1px solid #ddd;padding:10px}
</style><header><h1>Guevara Câmbio</h1><p>Câmbio, pagamento e acompanhamento de ordens.</p></header><main>
<nav><button onclick="tab('home')">Início</button><button onclick="tab('account')">Conta</button><button onclick="tab('orders')">Ordens</button><button onclick="tab('admin')">Admin</button></nav>
<section id="home"><div class="g"><div class="c"><h2>Cotação</h2><select id="cur"></select><input id="amt" type="number" placeholder="Valor"><button onclick="calc()">Calcular</button><p id="out"></p></div>
<div class="c"><h2>Nova ordem</h2><input id="ctype" placeholder="Nacional / Estrangeiro"><select id="ful"><option value="withdrawal">Levantamento</option><option value="delivery">Entrega</option></select><input id="addr" placeholder="Endereço (entrega)"><input id="loc" placeholder="Local (levantamento)"><button onclick="order()">Criar ordem</button></div>
<div class="c"><h2>Levantamento</h2><input id="wr" placeholder="Referência GC-..."><input id="wc" placeholder="Código 6 dígitos"><button onclick="withdraw()">Validar código</button><p id="wm"></p></div></div></section>
<section id="account" class="hide"><div class="g"><div class="c"><h2>Criar conta</h2><input id="rn" placeholder="Nome"><input id="re" placeholder="Email"><input id="rp" placeholder="Telefone"><input id="rnif" placeholder="NIF"><input id="rid" placeholder="Documento"><input id="rpass" type="password" placeholder="Senha (8+)"><button onclick="reg()">Cadastrar</button></div><div class="c"><h2>Entrar</h2><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Senha"><button onclick="login()">Entrar</button><button onclick="logout()">Sair</button><p id="sess"></p></div></div></section>
<section id="orders" class="hide"><div class="c"><h2>Minhas ordens</h2><div id="ob"></div></div></section>
<section id="admin" class="hide"><div class="c"><h2>Administração</h2><p>Somente a conta admin configurada no servidor.</p><div id="ab"></div></div></section>
</main><script>
let T=localStorage.gc||'',R=[],$=x=>document.getElementById(x);async function api(u,o={}){o.headers={...(o.headers||{}),...(T?{Authorization:'Bearer '+T}:{})};let r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro');return d}
function tab(x){document.querySelectorAll('section').forEach(s=>s.classList.add('hide'));$(x).classList.remove('hide');if(x==='orders')loadOrders();if(x==='admin')loadAdmin()}
async function init(){R=await api('/api/rates');$('cur').innerHTML=R.map(x=>`<option>${x.currency}</option>`).join('')}function calc(){let r=R.find(x=>x.currency==$('cur').value),a=+$('amt').value;$('out').textContent=r&&a?`${a} ${r.currency} = ${(a*r.buy_rate).toLocaleString('pt-AO')} Kz`:''}
async function reg(){try{let d=await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({x:{name:$('rn').value,email:$('re').value,phone:$('rp').value,nif:$('rnif').value,id_document:$('rid').value,password:$('rpass').value}})});T=d.token;localStorage.gc=T;$('sess').textContent='Conta: '+d.user.name}catch(e){alert(e.message)}}
async function login(){try{let d=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('le').value,password:$('lp').value})});T=d.token;localStorage.gc=T;$('sess').textContent='Sessão: '+d.user.name}catch(e){alert(e.message)}}function logout(){T='';localStorage.removeItem('gc');$('sess').textContent='Saiu.'}
async function order(){try{let d=await api('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currency:$('cur').value,foreign_amount:$('amt').value,customer_type:$('ctype').value,fulfillment:$('ful').value,delivery_address:$('addr').value,withdrawal_location:$('loc').value})});alert('Ordem '+d.reference+' criada.');tab('orders')}catch(e){alert(e.message)}}
async function loadOrders(){try{let a=await api('/api/orders');$('ob').innerHTML=a.map(o=>`<div class=item><b>${o.reference}</b> — ${o.currency} ${o.foreign_amount}<br>Total: ${o.kwanza_amount} Kz<br>Estado: ${o.order_status}<br>Pagamento: ${o.payment_status}<input type=file id=f${o.id}><button onclick="proof(${o.id})">Enviar comprovativo</button></div>`).join('')||'Nenhuma ordem.'}catch(e){$('ob').textContent=e.message}}
async function proof(id){let f=$('f'+id).files[0];if(!f)return alert('Escolha o comprovativo.');let fd=new FormData();fd.append('proof',f);try{await api('/api/orders/'+id+'/proof',{method:'POST',body:fd});alert('Comprovativo enviado.');loadOrders()}catch(e){alert(e.message)}}
async function loadAdmin(){try{let a=await api('/api/orders');$('ab').innerHTML=a.map(o=>`<div class=item><b>${o.reference}</b> — ${o.name||''} — ${o.kwanza_amount} Kz — ${o.order_status}<button onclick="upd(${o.id},'confirmed','processing')">Confirmar pagamento</button><button onclick="upd(${o.id},null,'ready')">Pronto / gerar código</button></div>`).join('')}catch(e){$('ab').textContent=e.message}}
async function upd(id,p,s){try{let d=await api('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({payment_status:p,order_status:s})});if(d.withdrawal_code)alert('Código: '+d.withdrawal_code);loadAdmin()}catch(e){alert(e.message)}}
async function withdraw(){let d=await fetch('/api/withdrawals/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:$('wr').value,code:$('wc').value})}).then(r=>r.json());$('wm').textContent=d.message||d.error}
init()
</script></html>
